<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montador de Times VG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            background: #fff;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .screen { display: none; flex-direction: column; }
        .screen.active { display: flex; }
        
        #screen-inicio {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        
        .logo-section {
            background: linear-gradient(135deg, #E80B8F 0%, #9B5DE5 100%);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            box-sizing: border-box;
        }
        
        .logo { 
            width: 140px; 
            height: 140px; 
            border-radius: 50%; 
            background: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.25); 
            flex-shrink: 0;
            margin-top: 20px;
        }
        
        .logo img { width: 100%; height: 100%; object-fit: cover; }
        
        .logo-section h1 { 
            color: white; 
            font-size: 32px; 
            margin: 40px 0 20px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .logo-section .button { 
            max-width: 320px; 
            width: 100%; 
            margin-top: 40px;
        }
        
        #screen-estrategia, #screen-selecao, #screen-resultado {
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .header {
            padding: 20px;
            flex-shrink: 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .header h1 { font-size: 24px; color: #001F5C; margin-bottom: 8px; }
        .header p { font-size: 14px; color: #666; }
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .button { padding: 12px 20px; border: 1px solid #ddd; background: white; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; width: 100%; }
        .button.primary { background: #E80B8F; color: white; border: none; padding: 14px 20px; font-size: 16px; font-weight: 600; }
        
        .option { border: 2px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 12px; cursor: pointer; }
        .option:hover { border-color: #E80B8F; }
        .option.selected { border-color: #E80B8F; background: #fdf5fa; }
        .option h3 { font-size: 16px; color: #001F5C; margin-bottom: 8px; }
        .option p { font-size: 13px; color: #666; }
        
        .jogadora { display: flex; gap: 10px; align-items: center; padding: 10px; background: #f9f9f9; border-radius: 6px; margin-bottom: 8px; }
        .jogadora input { width: 18px; height: 18px; }
        .jogadora label { flex: 1; cursor: pointer; font-size: 14px; }
        
        .time { border: 2px solid #E80B8F; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .time-title { color: #E80B8F; font-weight: 600; font-size: 14px; margin-bottom: 12px; }
        .player { font-size: 12px; padding: 6px; background: #f9f9f9; margin-bottom: 4px; border-radius: 4px; }
        
        .badge { display: inline-block; background: #E80B8F; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; margin-left: 10px; }
        
        .controls {
            display: flex;
            gap: 12px;
            padding: 20px;
            flex-shrink: 0;
        }
        .controls:last-child {
            border-top: 1px solid #f0f0f0;
        }
        .controls .button { flex: 1; margin: 0; }
        
        .espera { border: 2px dashed #FFD60A; border-radius: 8px; padding: 16px; margin-top: 12px; }
        .espera-title { color: #FF9F1C; font-weight: 600; margin-bottom: 10px; }
        .espera-jogadora { font-size: 13px; padding: 6px 0; color: #001F5C; }
    </style>
</head>
<body>
    <div id="screen-inicio" class="screen active">
        <div class="logo-section">
            <div class="logo">
                <img src="logo.jpeg" alt="Logo" onError="this.src='data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23E80B8F%22/&gt;&lt;/svg&gt;'">
            </div>
            <div>
                <h1>Montador de times VG</h1>
                <button class="button primary" onclick="showScreen('selecao')">Iniciar partida</button>
            </div>
        </div>
    </div>

    <div id="screen-selecao" class="screen">
        <div class="header">
            <h1>Quem vai jogar?</h1>
            <p>Marque as jogadoras que pagaram <span class="badge" id="count">0</span></p>
        </div>
        <div style="padding: 20px; padding-bottom: 0;">
            <input type="text" id="search-input" placeholder="🔍 Buscar jogadora..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;" onkeyup="filterPlayers()">
        </div>
        <div class="controls" style="margin-bottom: 15px; margin-top: 15px;">
            <button class="button" onclick="selectAll()">Todas</button>
            <button class="button" onclick="deselectAll()">Nenhuma</button>
        </div>
        <div class="content" id="jogadoras-list"></div>
        <div class="controls">
            <button class="button" onclick="showScreen('inicio')">Voltar</button>
            <button class="button primary" onclick="buildTeams()">Montar</button>
        </div>
    </div>

    <div id="screen-resultado" class="screen">
        <div class="header">
            <h1>Times prontos!</h1>
            <p id="summary"></p>
        </div>
        <div class="content" id="teams-list"></div>
        <div class="controls">
            <button class="button" onclick="showScreen('selecao')">Voltar</button>
            <button class="button" onclick="showScreen('inicio')">Nova partida</button>

    </div>

            {nome: "Teffy", ataque: 0, levantamento: 4, passe: 0},
            {nome: "Vanessa", ataque: 2, levantamento: 0, passe: 0},
            {nome: "Victor Castro", ataque: 0, levantamento: 5, passe: 0},
            {nome: "Victor Edilene", ataque: 0, levantamento: 5, passe: 0},
            {nome: "Vini", ataque: 0, levantamento: 5, passe: 0},
            {nome: "Vitória", ataque: 3, levantamento: 0, passe: 0},
            {nome: "Yane Viller", ataque: 0, levantamento: 0, passe: 1},
            {nome: "Yasmin", ataque: 2, levantamento: 0, passe: 0}
        ];

        let selected = [];

        function showScreen(name) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + name).classList.add('active');
            if (name === 'selecao') {
                renderPlayers();
                const searchInput = document.getElementById('search-input');
                if (searchInput) searchInput.value = '';
            }
        }

        function renderPlayers() {
            const html = players.map((p, i) => {
                const isChecked = selected.some(s => s.nome === p.nome) ? 'checked' : '';
                return `
                    <div class="jogadora">
                        <input type="checkbox" id="p${i}" onchange="updateCount()" ${isChecked}>
                        <label for="p${i}">${p.nome}</label>
                    </div>
                `;
            }).join('');
            document.getElementById('jogadoras-list').innerHTML = html;
        }

        function filterPlayers() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const jogadorasList = document.getElementById('jogadoras-list');
            
            if (searchTerm === '') {
                // Se campo vazio, mostra todos
                renderPlayers();
                return;
            }

            const filtered = players
                .map((p, i) => ({ player: p, index: i }))
                .filter(item => item.player.nome.toLowerCase().includes(searchTerm));

            const html = filtered.map(item => {
                const isChecked = selected.some(s => s.nome === item.player.nome) ? 'checked' : '';
                return `
                    <div class="jogadora">
                        <input type="checkbox" id="p${item.index}" onchange="updateCount()" ${isChecked}>
                        <label for="p${item.index}">${item.player.nome}</label>
                    </div>
                `;
            }).join('');

            jogadorasList.innerHTML = html || '<p style="padding: 20px; color: #999; text-align: center;">Nenhuma jogadora encontrada</p>';
        }

        function updateCount() {
            selected = [];
            document.querySelectorAll('input:checked').forEach(cb => {
                const i = parseInt(cb.id.substring(1));
                selected.push(players[i]);
            });
            document.getElementById('count').textContent = selected.length;
        }

        function selectAll() {
            document.querySelectorAll('input').forEach(cb => cb.checked = true);
            updateCount();
        }

        function deselectAll() {
            document.querySelectorAll('input').forEach(cb => cb.checked = false);
            updateCount();
        }

        function getCategoria(p) {
            if (p.levantamento === 5 || p.levantamento === 4) return 'Levantador';
            if (p.ataque === 5 || p.ataque === 4) return 'Ataque1';
            if (p.ataque === 3 || p.ataque === 2) return 'Ataque2';
            if (p.passe === 5 || p.passe === 4 || p.passe === 3 || p.passe === 2) return 'Passe';
            return 'Outro';
        }

        function buildTeams() {
            if (selected.length < 4) { alert('Mínimo 4 jogadoras'); return; }

            const levantadores = selected.filter(p => getCategoria(p) === 'Levantador');
            const ataque1 = selected.filter(p => getCategoria(p) === 'Ataque1');
            const ataque2 = selected.filter(p => getCategoria(p) === 'Ataque2');
            const passes = selected.filter(p => getCategoria(p) === 'Passe');

            // PRIORIDADE: 1L obrigatório = número de times
            let numTimes = levantadores.length;

            if (numTimes === 0) {
                alert('❌ Precisa de levantadores!');
                return;
            }

            let teams = [];
            let lIdx = 0, a1Idx = 0, a2Idx = 0, pIdx = 0;

            // PASSO 1: Montar os N times com PRIORIDADE absoluta
            // Estrutura: 1L + 2A (A1 > A2) + 1P (quando tiver)
            for (let i = 0; i < numTimes; i++) {
                let time = [];
                
                // 1. LEVANTADOR (obrigatório)
                time.push(levantadores[lIdx++]);
                
                // 2. PRIMEIRO ATAQUE (prioriza A1)
                if (a1Idx < ataque1.length) {
                    time.push(ataque1[a1Idx++]);
                } else {
                    time.push(ataque2[a2Idx++]);
                }
                
                // 3. SEGUNDO ATAQUE (usa A2, depois sobra A1)
                if (a2Idx < ataque2.length) {
                    time.push(ataque2[a2Idx++]);
                } else if (a1Idx < ataque1.length) {
                    time.push(ataque1[a1Idx++]);
                }
                
                // 4. PASSE (quando tiver)
                if (pIdx < passes.length) {
                    time.push(passes[pIdx++]);
                }
                
                teams.push(time);
            }

            // PASSO 2: Distribuir A2 extras no time sem Passe (o último que vai ter menos P)
            // Encontra qual time ficou sem Passe
            let timesSemPasse = teams.map((t, i) => ({ idx: i, tamanho: t.length }))
                                      .filter(x => x.tamanho === 3);
            
            if (timesSemPasse.length > 0) {
                let timeSemPasseIdx = timesSemPasse[0].idx;
                // Adiciona A2 extras a esse time
                while (a2Idx < ataque2.length) {
                    teams[timeSemPasseIdx].push(ataque2[a2Idx++]);
                }
            }

            // Verificar se ficou alguém de fora (não deveria, mas por segurança)
            const usados = new Set();
            teams.forEach(t => t.forEach(p => usados.add(p.nome)));
            const benched = selected.filter(p => !usados.has(p.nome));

            let html = teams.map((t, i) => {
                return `<div class="time"><div class="time-title">Time ${i + 1} (${t.length})</div>${t.map(p => `<div class="player"><strong>${p.nome}</strong> (${getCategoria(p)}) - A:${p.ataque} L:${p.levantamento} P:${p.passe}</div>`).join('')}</div>`;
            }).join('');

            if (benched.length > 0) {
                html += `<div class="espera"><div class="espera-title">Na espera (${benched.length})</div>${benched.map(p => `<div class="espera-jogadora">${p.nome} (${getCategoria(p)})</div>`).join('')}</div>`;
                alert(`⚠️ ${benched.length} jogadora(s) na espera.\nTotal: ${selected.length} | Times: ${teams.length}`);
            }

            document.getElementById('teams-list').innerHTML = html;
            document.getElementById('summary').textContent = `${teams.length} times${benched.length > 0 ? ' + ' + benched.length + ' na espera' : ''}`;
            showScreen('resultado');
        }
    </script>
